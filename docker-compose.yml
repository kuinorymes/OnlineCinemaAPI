services:
  db:
    image: "postgres:latest"
    container_name: "postgres_cinema"
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_cinema_data:/var/lib/postgresql/data/
    networks:
      - "cinema_api_network"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h 127.0.0.1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    restart: always
    build: .
    container_name: "cinema_backend"
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - .env
    environment:
      - LOG_LEVEL=debug
      - PYTHONPATH=/usr/src/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/usr/src/app
    networks:
      - "cinema_api_network"

  redis:
    image: redis:latest
    restart: always
    container_name: "redis_container"
    ports:
      - "6379:6379"
    networks:
      - "cinema_api_network"

  celery_worker:
    build: .
    restart: always
    depends_on:
      - redis
      - db
      - web
    env_file:
      - .env
    command: ["celery", "-A", "celery_app.config.app", "worker", "--pool=solo", "--loglevel=info"]
    networks:
      - "cinema_api_network"

  celery_beat:
    build: .
    restart: always
    depends_on:
      - redis
      - db
      - celery_worker
    env_file:
      - .env
    command: ["celery", "-A", "celery_app.config.app", "beat", "--loglevel=info"]
    networks:
      - "cinema_api_network"
  migrator:
    build: .
    command: >
      sh -c "
      alembic upgrade head &&
      alembic revision --autogenerate -m 'Initial migration' &&
      alembic upgrade head"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - "cinema_api_network"
    volumes:
      - ./src/database/migrations:/usr/src/app/database/migrations

volumes:
  postgres_cinema_data:

networks:
  cinema_api_network:
    driver: bridge
